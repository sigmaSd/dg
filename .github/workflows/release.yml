name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - feat/cross-platform-bundle
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild for Windows
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Find or create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null ||
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  build:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') && github.event_name != 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output: dg-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            output: dg-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            output: dg-macos-aarch64

    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2

      - name: Build binary
        run: |
          deno compile --frozen --minimum-dependency-age=0 --allow-all --no-prompt --unstable-kv --unstable-worker-options --include src/plugins/worker/client.ts --output ${{ matrix.output }} --target ${{ matrix.target }} src/main.ts

      - name: Upload binary
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "${{ matrix.output }}" --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    needs: prepare
    if: ${{ !cancelled() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: denoland/setup-deno@v2

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          cache: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-7zip

      - name: Build binary
        run: |
          deno compile --frozen --minimum-dependency-age=0 --allow-all --no-prompt --unstable-kv --unstable-worker-options --include src/plugins/worker/client.ts --output dg-windows.exe --target x86_64-pc-windows-msvc src/main.ts

      - name: Package Windows downloads
        shell: msys2 {0}
        run: |
          mkdir -p dist-windows/share
          cp dg-windows.exe dist-windows/dg.exe
          cp "$MINGW_PREFIX"/bin/*.dll dist-windows/
          cp -r "$MINGW_PREFIX"/share/icons "$MINGW_PREFIX"/share/glib-2.0 dist-windows/share/
          7z a dg-windows.zip ./dist-windows/*

          SFX_STUB=
          for dir in "/usr/lib/7zip" "$MINGW_PREFIX/lib/7zip" "$MINGW_PREFIX/bin" "/c/Program Files/7-Zip"; do
            for name in 7zSD.sfx 7zS.sfx; do
              if [ -f "$dir/$name" ]; then
                SFX_STUB="$dir/$name"
                break 2
              fi
            done
          done

          if [ -z "$SFX_STUB" ]; then
            if curl -fL -o 7z-extra.7z https://www.7-zip.org/a/7z2408-extra.7z &&
              7z x 7z-extra.7z 7zS.sfx && [ -f 7zS.sfx ]; then
              SFX_STUB=7zS.sfx
            fi
          fi

          if [ -n "$SFX_STUB" ]; then
            printf '%s\n' ';!@Install@!UTF-8!' 'RunProgram="dg.exe"' ';!@InstallEnd@!' > sfx_config.txt
            7z a dg-bundle.7z ./dist-windows/*
            cat "$SFX_STUB" sfx_config.txt dg-bundle.7z > dg-portable.exe
          else
            echo "::warning::No installer SFX stub found. The portable ZIP is available."
          fi

      - name: Upload Windows downloads
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $files = @('dg-windows.exe', 'dg-windows.zip')
          if (Test-Path 'dg-portable.exe') { $files += 'dg-portable.exe' }
          gh release upload $env:RELEASE_TAG @files --repo $env:GITHUB_REPOSITORY --clobber
